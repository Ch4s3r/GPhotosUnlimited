name: Android CI

on:
  workflow_dispatch:
  push:
    branches: main
    paths-ignore: '**.md'
  pull_request:
    branches: main
    paths-ignore: '**.md'

jobs:
  build:

    runs-on: macos-26

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run native config path unit test
      run: |
        clang++ -std=c++23 -fno-exceptions -fno-rtti tests/test_config_path.cpp -o /tmp/test_config_path
        /tmp/test_config_path

    - name: Run WebUI unit test
      run: node --test tests/test_webui.mjs

    - name: Build with Gradle
      run: ./gradlew --warning-mode all assembleRelease

    - name: Upload CI module zip as artifact zip
      uses: actions/upload-artifact@v7
      with:
        name: GPhotosUnlimited-CI_#${{ github.run_number }}
        path: 'module/*'
        compression-level: 9
